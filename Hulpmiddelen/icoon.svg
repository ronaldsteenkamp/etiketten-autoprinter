<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Etiketten autoprinter - app-icoon (32 px en groter). Bron voor maak_icoon.ps1 -->
  <defs>
    <linearGradient id="tegel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7cff"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <radialGradient id="glans" cx="0.3" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="etiket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="schaduw" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.38"/>
    </filter>
    <filter id="schaduwKlein" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tegel -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tegel)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glans)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Etiket met barcode (licht gedraaid) -->
  <g transform="rotate(-8 124 122)" filter="url(#schaduw)">
    <rect x="44" y="62" width="160" height="118" rx="18" fill="url(#etiket)"/>
    <!-- kopstrook -->
    <rect x="62" y="80" width="62" height="11" rx="5.5" fill="#6366f1"/>
    <rect x="132" y="80" width="38" height="11" rx="5.5" fill="#c7d2fe"/>
    <!-- barcode -->
    <g fill="#1e293b">
      <rect x="62" y="104" width="6" height="52" rx="1.5"/>
      <rect x="73" y="104" width="3" height="52" rx="1"/>
      <rect x="81" y="104" width="9" height="52" rx="1.5"/>
      <rect x="95" y="104" width="3" height="52" rx="1"/>
      <rect x="103" y="104" width="5" height="52" rx="1.5"/>
      <rect x="113" y="104" width="3" height="52" rx="1"/>
      <rect x="121" y="104" width="8" height="52" rx="1.5"/>
      <rect x="134" y="104" width="3" height="52" rx="1"/>
      <rect x="142" y="104" width="6" height="52" rx="1.5"/>
      <rect x="153" y="104" width="3" height="52" rx="1"/>
      <rect x="161" y="104" width="9" height="52" rx="1.5"/>
      <rect x="175" y="104" width="4" height="52" rx="1"/>
    </g>
  </g>

  <!-- Vinkje-badge -->
  <g filter="url(#schaduwKlein)">
    <circle cx="190" cy="190" r="46" fill="#fff"/>
    <circle cx="190" cy="190" r="38" fill="url(#badge)"/>
  </g>
  <path d="M172 191 l12 12 l24 -25" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
