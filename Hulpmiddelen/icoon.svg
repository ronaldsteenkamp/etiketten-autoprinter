<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Etiketten autoprinter - app-icoon (32 px en groter): vliegend etiket met barcode,
       vlak en alleen in BENU-groen (#58A618 en donkergroen #47820C) met wit.
       Bron voor maak_icoon.ps1 -->
  <!-- Tegel -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#58a618"/>

  <!-- Snelheidsstreepjes: het printen gaat vanzelf -->
  <g stroke="#c5e3a6" stroke-width="18" stroke-linecap="round">
    <line x1="60" y1="206" x2="124" y2="206"/>
    <line x1="84" y1="256" x2="136" y2="256"/>
    <line x1="60" y1="306" x2="124" y2="306"/>
  </g>

  <!-- Hangetiket met barcode, licht gekanteld -->
  <g transform="rotate(-10 280 256)">
    <path d="M196 164 H360 L440 256 L360 348 H196 a28 28 0 0 1 -28 -28 V192 a28 28 0 0 1 28 -28 Z" fill="#ffffff"/>
    <circle cx="388" cy="256" r="16" fill="#58a618"/>
    <g fill="#47820c">
      <rect x="200.0" y="196" width="14.9" height="120"/>
      <rect x="219.9" y="196" width="5.0" height="120"/>
      <rect x="234.8" y="196" width="5.0" height="120"/>
      <rect x="244.7" y="196" width="14.9" height="120"/>
      <rect x="269.5" y="196" width="5.0" height="120"/>
      <rect x="279.4" y="196" width="9.9" height="120"/>
      <rect x="304.3" y="196" width="5.0" height="120"/>
      <rect x="319.2" y="196" width="5.0" height="120"/>
      <rect x="329.1" y="196" width="14.9" height="120"/>
    </g>
  </g>
</svg>
