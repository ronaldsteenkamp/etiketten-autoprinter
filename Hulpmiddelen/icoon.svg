<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Etiketten autoprinter - app-icoon (32 px en groter), vlak in BENU-kleuren.
       Groen #58A618 en marineblauw #002664 uit het BENU-logo. Bron voor maak_icoon.ps1 -->
  <!-- Tegel -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#58a618"/>

  <!-- Etiket met barcode (licht gedraaid), met een vlakke schaduw -->
  <g transform="rotate(-8 124 122)">
    <rect x="44" y="70" width="160" height="118" rx="16" fill="#3f7a0b"/>
    <rect x="44" y="62" width="160" height="118" rx="16" fill="#ffffff"/>
    <rect x="62" y="80" width="62" height="11" rx="5.5" fill="#58a618"/>
    <rect x="132" y="80" width="38" height="11" rx="5.5" fill="#d6ebc4"/>
    <g fill="#002664">
      <rect x="62" y="104" width="6" height="52"/>
      <rect x="73" y="104" width="3" height="52"/>
      <rect x="81" y="104" width="9" height="52"/>
      <rect x="95" y="104" width="3" height="52"/>
      <rect x="103" y="104" width="5" height="52"/>
      <rect x="113" y="104" width="3" height="52"/>
      <rect x="121" y="104" width="8" height="52"/>
      <rect x="134" y="104" width="3" height="52"/>
      <rect x="142" y="104" width="6" height="52"/>
      <rect x="153" y="104" width="3" height="52"/>
      <rect x="161" y="104" width="9" height="52"/>
      <rect x="175" y="104" width="4" height="52"/>
    </g>
  </g>

  <!-- Vinkje-badge -->
  <circle cx="190" cy="190" r="46" fill="#ffffff"/>
  <circle cx="190" cy="190" r="37" fill="#002664"/>
  <path d="M172 191 l12 12 l24 -25" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
